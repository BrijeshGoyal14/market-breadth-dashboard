[theme]
# Set the base theme to light
base = "light"

# Action Blue (#0066cc) for all interactive accents (sliders, active states)
primaryColor = "#0066cc"

# Pure White Canvas (#ffffff) for the main background
backgroundColor = "#ffffff"

# Parchment (#f5f5f7) for the sidebar background
secondaryBackgroundColor = "#f5f5f7"

# Near-Black Ink (#1d1d1f) for all global text
textColor = "#1d1d1f"

# Native sans-serif to bridge with our CSS font injection
font = "sans serif"